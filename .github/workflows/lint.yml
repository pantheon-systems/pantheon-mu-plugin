name: Lint
on: [pull_request]
permissions:
  contents: read
jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Lint
              run: |
                composer install
                composer lint
